# NEBOSH proctoring — production vhosts for proctoring-alt.com.
#
# Deployed into the shared nginx container (nearvendor_nginx_gcp), which owns
# ports 80/443 on the prod host:
#   cp nginx/proctoring-alt.com.conf ~/alt/near-vendor/deploy/nginx/conf.d/
#   docker exec nearvendor_nginx_gcp nginx -t && docker exec nearvendor_nginx_gcp nginx -s reload
#
# Requirements:
# - that container joined to our network:
#     docker network connect nebosh_backend-net nearvendor_nginx_gcp
# - certs issued via webroot into near-vendor/deploy/certbot_conf (own certs
#   per hostname, separate from nearvendor's)
# - the "safe" log_format, defined in that container's api.nearvendor.pro.conf
#   (logs path only, so WS ?token= and presigned-URL signatures never hit logs)
#
# Upstreams are resolved per request (Docker DNS + variables) rather than at
# startup, so this nginx still starts/reloads when the nebosh containers are
# down — our outage can never take the other sites on this host down with it.
# (nginx/nebosh-backend.conf is the host-nginx variant, kept for single-tenant hosts.)

limit_req_zone $binary_remote_addr zone=nebosh_api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name api.proctoring-alt.com files.proctoring-alt.com;
    access_log /var/log/nginx/access.log safe;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.proctoring-alt.com;
    access_log /var/log/nginx/access.log safe;

    ssl_certificate /etc/letsencrypt/live/api.proctoring-alt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.proctoring-alt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25M;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nebosh_backend http://nebosh-backend:8000;

    # Internal only — on the host use http://localhost:8000/... instead
    location ~ ^/(metrics|health/ready)$ { deny all; }

    # Continuous proctoring stream (long-lived WebSockets)
    location /ws/ {
        proxy_pass $nebosh_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=nebosh_api_limit burst=20 nodelay;
        proxy_pass $nebosh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Presigned snapshot / KYC image links (S3_PUBLIC_ENDPOINT_URL). Read-only.
# Host must pass through unchanged: links are signed for this hostname.
server {
    listen 443 ssl;
    http2 on;
    server_name files.proctoring-alt.com;
    access_log /var/log/nginx/access.log safe;

    ssl_certificate /etc/letsencrypt/live/files.proctoring-alt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.proctoring-alt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nebosh_storage http://nebosh-storage:9000;

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass $nebosh_storage;
        proxy_set_header Host $host;
    }
}
