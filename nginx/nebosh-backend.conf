# Nginx configuration for NEBOSH/IOSH Proctoring Backend API
# Place in /etc/nginx/sites-available/nebosh-api and symlink to /etc/nginx/sites-enabled/

# Rate limiting zone (optional, protects against brute force)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    # SSL Certificates (managed via Certbot: certbot --nginx -d api.yourdomain.com)
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Upload size limit for ID cards / photos (adjust if needed)
    client_max_body_size 25M;

    # Proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    # WebSocket endpoints (Continuous exam proctoring stream)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep alive long WebSocket sessions without timeout disconnects
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Internal only: scrape /metrics and probe /health/ready from the host or
    # the private network, never from the internet.
    location ~ ^/(metrics|health/ready)$ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }

    # REST API and Health Endpoints
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}

# Public host for presigned snapshot / KYC image links (S3_PUBLIC_ENDPOINT_URL).
# The Host header must be passed through unchanged: presigned URLs are signed
# for this hostname and the store re-checks the signature against it.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/files.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Read-only: presigned GETs only, never expose uploads/listing publicly.
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
    }
}
