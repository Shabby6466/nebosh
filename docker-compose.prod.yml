services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nebosh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-proctoring}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-proctoring}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-net

  redis:
    image: redis:7-alpine
    container_name: nebosh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nebosh-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "${HOST_PORT:-127.0.0.1:8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend-net

  # Admin dashboard (compliance review, vendor API keys/webhooks), served at
  # admin.proctoring-alt.com via the tunnel: http://nebosh-admin:80
  admin:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://api.proctoring-alt.com
    container_name: nebosh-admin
    restart: unless-stopped
    networks:
      - backend-net

  # Public ingress via Cloudflare Tunnel: an outbound-only connection to
  # Cloudflare, so no inbound ports/firewall forwarding are needed. Hostnames
  # are mapped in the Cloudflare dashboard (Zero Trust > Tunnels):
  #   api.proctoring-alt.com   -> http://nebosh-backend:8000
  #   files.proctoring-alt.com -> http://nebosh-storage:9000
  #   admin.proctoring-alt.com -> http://nebosh-admin:80
  # Needs TUNNEL_TOKEN in .env.production. Start with:
  #   docker compose -f docker-compose.prod.yml --profile tunnel up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: nebosh-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env.production
    depends_on:
      - backend
    profiles:
      - tunnel
    networks:
      - backend-net

  # Self-hosted S3-compatible Object Storage (SeaweedFS)
  # If using AWS S3 / Cloudflare R2 / Wasabi, you can comment this out.
  minio:
    image: chrislusf/seaweedfs:latest
    container_name: nebosh-storage
    restart: unless-stopped
    # S3 auth is REQUIRED: files.proctoring-alt.com exposes this store publicly
    # (via the tunnel), so only requests signed with our keys — the backend's
    # own calls and the presigned links it hands out — may be served.
    # seaweedfs/s3.json holds the keys and is generated on the server (never
    # committed); see README "Storage credentials".
    command: "server -s3 -dir=/data -s3.port=9000 -ip=minio -s3.config=/etc/seaweedfs/s3.json"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
    volumes:
      - minio_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - backend-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  backend-net:
    driver: bridge
