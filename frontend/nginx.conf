server {
    listen 80;
    root /usr/share/nginx/html;

    # Security headers: the dashboard holds an admin token, so no framing,
    # no MIME sniffing, no referrer leakage, and it may only talk to the API.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.proctoring-alt.com; img-src 'self' data: https://files.proctoring-alt.com; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # Hashed build assets can be cached forever; index.html never.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.proctoring-alt.com; img-src 'self' data: https://files.proctoring-alt.com; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    }
}
